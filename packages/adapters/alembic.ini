# File: alembic.ini
# Description: Alembic config for SeismoBrain metadata schema migrations
# Author: Sri Yanto Qodarbaskoro
# Created: 2026-09-16

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
path_separator = os

sqlalchemy.url = sqlite+pysqlite:///./data/meta.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
