[project]
name = "seismobrain-contracts"
version = "0.0.0"
description = "seismobrain-contracts package for SeismoBrain"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seismobrain_contracts"]
