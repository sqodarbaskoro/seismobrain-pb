[project]
name = "seismobrain-core"
version = "0.0.0"
description = "seismobrain-core package for SeismoBrain"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=23.1.0",
    "PyJWT>=2.9.0",
    "cryptography>=43.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seismobrain_core"]
