[project]
name = "seismobrain-ingest"
version = "0.0.0"
description = "seismobrain-ingest package for SeismoBrain"
requires-python = ">=3.12"
dependencies = [
    "seismobrain-core",
    "seismobrain-adapters",
    "pypdf>=6.19.0",
]

[tool.uv.sources]
seismobrain-core = { workspace = true }
seismobrain-adapters = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seismobrain_ingest"]
