[project]
name = "seismobrain-eval"
version = "0.0.0"
description = "SeismoBrain evaluation runner and calibration"
requires-python = ">=3.12"
dependencies = [
    "seismobrain-core",
    "pyyaml>=6.0",
]

[project.scripts]
seismobrain-eval = "seismobrain_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seismobrain_eval"]
