[project]
name = "seismobrain-models"
version = "0.0.0"
description = "seismobrain-models package for SeismoBrain"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic-settings>=2.15.0",
    "httpx>=0.28",
    "seismobrain-core",
]

[tool.uv.sources]
seismobrain-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seismobrain_models"]
