[project]
name = "seismobrain-worker"
version = "0.0.0"
description = "seismobrain-worker package for SeismoBrain"
requires-python = ">=3.12"
dependencies = [
    "seismobrain-core",
    "seismobrain-adapters",
    "seismobrain-ingest",
]

[tool.uv.sources]
seismobrain-core = { workspace = true }
seismobrain-adapters = { workspace = true }
seismobrain-ingest = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seismobrain_worker"]
