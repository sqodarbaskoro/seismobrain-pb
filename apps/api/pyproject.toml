[project]
name = "seismobrain-api"
version = "0.0.0"
description = "seismobrain-api package for SeismoBrain"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.15.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "prometheus-client>=0.21",
    "httpx>=0.28",
    "email-validator>=2.2",
    "python-multipart>=0.0.20",
    "seismobrain-core",
    "seismobrain-contracts",
    "seismobrain-adapters",
    "seismobrain-ingest",
]

[tool.uv.sources]
seismobrain-core = { workspace = true }
seismobrain-contracts = { workspace = true }
seismobrain-adapters = { workspace = true }
seismobrain-ingest = { workspace = true }


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seismobrain_api"]
