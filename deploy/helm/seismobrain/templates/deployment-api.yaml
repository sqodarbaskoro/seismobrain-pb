apiVersion: apps/v1
kind: Deployment
metadata:
  name: seismobrain-api
  labels:
    app.kubernetes.io/name: seismobrain
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.replicaCount.api }}
  selector:
    matchLabels:
      app.kubernetes.io/name: seismobrain
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seismobrain
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: {{ .Values.image.api | quote }}
          ports:
            - containerPort: 8080
          env:
            - name: AIR_GAPPED
              value: {{ .Values.airGapped | quote }}
            - name: SB_TIER
              value: production
