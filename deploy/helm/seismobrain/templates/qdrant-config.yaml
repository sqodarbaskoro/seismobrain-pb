apiVersion: v1
kind: ConfigMap
metadata:
  name: seismobrain-qdrant-topology
  labels:
    app.kubernetes.io/name: seismobrain
data:
  shards: {{ .Values.qdrant.shards | quote }}
  replication_factor: {{ .Values.qdrant.replicationFactor | quote }}
  note: "Application code is shard-agnostic; Qdrant handles distribution."
