  worker: seismobrain/worker:0.0.0@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
  models: seismobrain/models-cpu:0.0.0@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
  web: seismobrain/web:0.0.0@sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd

networkPolicy:
  enabled: true
  airGapped: false

qdrant:
  shards: 2
  replicationFactor: 2

pgbouncer:
  enabled: true
  poolMode: transaction

models:
  batching: true
  maxBatchSize: 8

airGapped: false
