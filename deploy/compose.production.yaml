# Production-hardened single-host profile (NOT high availability).
# Use with: docker compose -f compose.yaml -f compose.production.yaml

x-limits: &limits
  deploy:
    resources:
      limits:
        cpus: "2.0"
        memory: 2G
      reservations:
        cpus: "0.25"
        memory: 256M

services:
  proxy:
    <<: *limits
    ports:
      - "443:443"
      - "80:80"
    environment:
      TLS_MODE: terminate
      BACKUP_CRON: "0 2 * * *"
      MONITORING: enabled

  api:
    <<: *limits
    environment:
      ENVIRONMENT: production
      SB_TIER: team

  models:
    <<: *limits

  worker-ingest:
    <<: *limits

  worker-default:
    <<: *limits

  web:
    <<: *limits

  postgres:
    <<: *limits

  redis:
    <<: *limits

  qdrant:
    <<: *limits
