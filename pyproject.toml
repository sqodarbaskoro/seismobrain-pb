[project]
name = "seismobrain"
version = "0.0.0"
description = "SeismoBrain monorepo root (uv workspace)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "seismobrain-core",
  "seismobrain-contracts",
  "seismobrain-adapters",
  "seismobrain-ingest",
  "seismobrain-api",
  "seismobrain-worker",
  "seismobrain-models",
  "seismobrain-eval",
]

[dependency-groups]
dev = [
  "mypy>=2.3.1",
  "pytest>=8.3",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.7",
  "testcontainers[postgres]>=4.9",
  "minio>=7.2",
  "types-boto3[s3]>=1.35",
  "pyyaml>=6.0",
  "hypothesis>=6.168.0",
]

[tool.uv.workspace]
members = [
  "packages/core",
  "packages/contracts",
  "packages/adapters",
  "packages/ingest",
  "apps/api",
  "apps/worker",
  "apps/models",
  "eval/runner",
]

[tool.uv.sources]
seismobrain-core = { workspace = true }
seismobrain-contracts = { workspace = true }
seismobrain-adapters = { workspace = true }
seismobrain-ingest = { workspace = true }
seismobrain-api = { workspace = true }
seismobrain-worker = { workspace = true }
seismobrain-models = { workspace = true }
seismobrain-eval = { workspace = true }

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = [
  "packages/core/src",
  "packages/contracts/src",
  "packages/adapters/src",
  "packages/ingest/src",
  "apps/api/src",
  "apps/worker/src",
  "apps/models/src",
  "eval/runner/src",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = [
  "packages/core/src",
  "packages/contracts/src",
  "packages/adapters/src",
  "packages/ingest/src",
  "apps/api/src",
  "apps/worker/src",
  "apps/models/src",
  "eval/runner/src",
]
packages = [
  "seismobrain_core",
  "seismobrain_contracts",
  "seismobrain_adapters",
  "seismobrain_ingest",
  "seismobrain_api",
  "seismobrain_worker",
  "seismobrain_models",
  "seismobrain_eval",
]

[tool.pytest.ini_options]
testpaths = [
  "packages/core/tests",
  "packages/contracts/tests",
  "packages/adapters/tests",
  "packages/ingest/tests",
  "apps/api/tests",
  "apps/worker/tests",
  "apps/models/tests",
  "deploy/tests",
  "eval/runner/tests",
]
pythonpath = [
  "packages/core/src",
  "packages/contracts/src",
  "packages/adapters/src",
  "packages/ingest/src",
  "apps/api/src",
  "apps/worker/src",
  "apps/models/src",
  "eval/runner/src",
]
